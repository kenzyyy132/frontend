<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LUMORA — Glow Like You Mean It</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="LUMORA — clean, vegan, dermatologist-approved beauty. Skincare, makeup, perfume and gift sets."
    />
    <meta name="theme-color" content="#9a5fc4" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
     
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('lumora.theme'));
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
